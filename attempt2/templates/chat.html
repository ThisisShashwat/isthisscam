<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Insta</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script async src="https://www.instagram.com/embed.js"></script>

    <style>

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #e9edf1;
        }

        .chat {
            margin: 0 auto;
            padding: 16px;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        #chat-inner {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }


        .bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 16px;
            line-height: 1.35;
            font-size: 14px;
            word-wrap: break-word;
            scroll-margin-top: 35vh;
        }

        .them {
            align-self: flex-start;
            background: #fff;
            border-bottom-left-radius: 4px;
        }

        .me {
            align-self: flex-end;
            background: #224238;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .meta {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        .me .meta {
            color: #d7e9ff;
        }

        .media img, .media video {
            max-width: 100%;
            max-height: 240px;
            width: auto;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            margin-top: 4px;
            cursor: pointer;
        }

        /*.media audio {*/
        /*    width: inherit;*/
        /*}*/

        .reply-quote {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            border-left: 3px solid currentColor;
            padding: 2px 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.06);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .them:target {
            animation: highlight-fade-them 3.5s ease-out forwards;
        }

        .me:target {
            animation: highlight-fade-me 3.5s ease-out forwards;
        }

        @keyframes highlight-fade-them {
            0%, 60% {
                background-color: #ffe27a;
            }
            100% {
                background-color: #fff;
            }
        }

        @keyframes highlight-fade-me {
            0%, 60% {
                background-color: #ffb703;
            }
            100% {
                background-color: #224238;
            }
        }

        .media {
            max-width: 100%;
            overflow: hidden;
        }

        .media blockquote.instagram-media {
            max-width: 100% !important;
        }

        .media iframe.instagram-media {
            transform-origin: top left;
        }

    </style>
</head>
<body>
<div class="chat" id="chat">
    <div id="chat-inner">
        {% include "bubbles.html" %}
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const chatInner = document.getElementById('chat-inner');
    let stickToBottom = true;

    chat.addEventListener('scroll', () => {
        stickToBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight <150;
    });

    const growRO = new ResizeObserver(() => {
        if (stickToBottom) {
            chat.scrollTo({top: chat.scrollHeight, behavior: 'instant'})
        }
    });

    growRO.observe(chatInner);

    function scaleEmbed(iframe) {
        const wrap = iframe.closest('.media');
        if (!wrap || !iframe.offsetWidth || iframe.offsetHeight < 50) return;
        const scale = Math.min(1, wrap.clientWidth / iframe.offsetWidth);
        iframe.style.transform = `scale(${scale})`;
        wrap.style.height = (iframe.offsetHeight * scale) + 'px';
    }

    const ro = new ResizeObserver(entries => entries.forEach(e => scaleEmbed(e.target)));

    new MutationObserver(() => {
        document.querySelectorAll('.media iframe.instagram-media:not([data-scaled])').forEach(iframe => {
            iframe.dataset.scaled = '1';
            ro.observe(iframe);
        });
    }).observe(chat, {childList: true, subtree: true});

    function loadInstagramEmbed(placeholder) {
        const blockquote = document.createElement('blockquote');
        blockquote.className = "instagram-media";
        blockquote.dataset.instgrmPermalink = placeholder.dataset.permalink;
        blockquote.dataset.instgrmVersion = "14";
        blockquote.style.margin = '0';
        blockquote.innerHTML = placeholder.innerHTML;
        placeholder.replaceWith(blockquote);

        (function tryProcess() {
            if (window.instgrm && window.instgrm.Embeds) {
                window.instgrm.Embeds.process(blockquote);

                const fallbackTimer = setTimeout(() => {
                    mo.disconnect();
                    blockquote.innerHTML = fallbackHTML;
                }, 10000);

                const mo = new MutationObserver(() => {
                    const hasIframe = blockquote.parentElement &&
                        blockquote.parentElement.querySelector('iframe.instagram-media');
                    if (hasIframe) {
                        clearTimeout(fallbackTimer);
                        mo.disconnect();
                    }
                });

                mo.observe(blockquote.parentNode, {childList: true});


            } else {
                setTimeout(tryProcess, 200);
            }
        })();
    }

    const igObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                igObserver.unobserve(entry.target);
                loadInstagramEmbed(entry.target);
            }
        });
    }, {root: chat, rootMargin: '400px'});

    document.querySelectorAll('.ig-embed-placeholder').forEach(e1 => igObserver.observe(e1));

    document.body.addEventListener('htmx:afterSwap', function () {
        document.querySelectorAll('.ig-embed-placeholder').forEach(e1 => igObserver.observe(e1));

    });

</script>
</body>
</html>
